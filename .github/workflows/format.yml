name: Formatting

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-format-18
      - name: Check all C sources and headers
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git ls-files -z -- '*.c' '*.h')
          test "${#files[@]}" -gt 0
          clang-format-18 --version
          clang-format-18 --dry-run --Werror "${files[@]}"
