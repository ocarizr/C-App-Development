name: Static Analysis

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Clang tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-18 clang-tidy-18 ninja-build
      - name: Configure analysis for application and tests
        run: >-
          cmake -S . -B build-tidy -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_C_CLANG_TIDY=clang-tidy-18
      - name: Analyze all compiled C sources
        run: cmake --build build-tidy --parallel
