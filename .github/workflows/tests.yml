name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests / ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTING=ON
      - name: Build tests
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
      - name: Run tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --no-tests=error

  sanitizers:
    name: Linux / address and undefined behavior sanitizers
    runs-on: ubuntu-latest
    env:
      CC: clang
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DWORKFORCE_SANITIZERS=ON
      - name: Build tests
        run: cmake --build build --parallel
      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error
